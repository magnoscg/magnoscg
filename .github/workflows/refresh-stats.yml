name: Refresh activity card

# Recounts assets/github-activity.svg from the GitHub API and commits it, so the
# card never drifts from the account it describes. The read token is separate
# from the write one on purpose: STATS_TOKEN only carries read:user, which is
# what makes private contributions countable, and the push uses the job's own
# GITHUB_TOKEN, which is scoped to this repository and expires with the job.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Recount the activity card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: npm run stats

      - name: Run profile tests
        run: npm test

      - name: Validate public proof
        run: npm run validate

      # The card carries the date it was counted, so it changes on every run.
      # That is the point: each commit is a fresh count, not noise.
      - name: Commit the recount
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity.svg
          git commit -m 'chore: recount the activity card'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
